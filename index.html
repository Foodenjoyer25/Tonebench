<title>Tonebench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a practice-room workbench — fixed instrument rack (sidebar) on the left, one tool at a time on the bench. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f5f6f9; --ink:#151a26; --muted:#5b6377; --line:#d9dde6;
  --accent:#0e7c6b; --accent-soft:#d5eee8; --root:#d4891c; --root-soft:#f8e7cc; --on-accent:#ffffff;
  --key-w:#fdfdfe; --key-b:#1b1f29; --key-edge:#b4bac8; --key-label:#7a8191; --press:#4a9ee0;
  --wood:#eadfcb; --fret:#b5a385; --string:#8c8474; --inlay:#d6c8ae;
  --good:#1f9d55; --warn:#b45309; --bad:#c62828;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#161b24; --surface-2:#1c2230; --ink:#e7eaf1; --muted:#99a1b3; --line:#2a3242;
  --accent:#38c3aa; --accent-soft:#16392f; --root:#f2a93b; --root-soft:#3b2c13; --on-accent:#08130f;
  --key-w:#e4e6ec; --key-b:#0b0d12; --key-edge:#5b6272; --key-label:#6b7280; --press:#6cb6f0;
  --wood:#2b231a; --fret:#6e5d45; --string:#a99f8d; --inlay:#4a3d2c;
  --good:#4ade80; --warn:#fb923c; --bad:#f87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#161b24; --surface-2:#1c2230; --ink:#e7eaf1; --muted:#99a1b3; --line:#2a3242;
  --accent:#38c3aa; --accent-soft:#16392f; --root:#f2a93b; --root-soft:#3b2c13; --on-accent:#08130f;
  --key-w:#e4e6ec; --key-b:#0b0d12; --key-edge:#5b6272; --key-label:#6b7280; --press:#6cb6f0;
  --wood:#2b231a; --fret:#6e5d45; --string:#a99f8d; --inlay:#4a3d2c;
  --good:#4ade80; --warn:#fb923c; --bad:#f87171; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 14px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:-.01em;line-height:1}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nav-g{margin-top:14px}
.nav-g h4{margin:0 0 4px;padding:0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.nav-g a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}
.nav-g a:hover{background:var(--surface-2)}
.nav-g a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-g a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.topbar{display:none}
main{min-width:0;padding-block:30px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.vh .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
.vh h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1.02;margin:4px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.vh p{margin:0;color:var(--muted);max-width:64ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.fld select,.fld input{min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-weight:500;font-size:14px}
.fld input[type=number]{width:96px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.big{font-family:var(--f-display);font-size:44px;line-height:1;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.chip small{font-size:10px;color:var(--muted);font-weight:500}
.chip.root{background:var(--root-soft);border-color:var(--root)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on small{color:var(--on-accent)}
.chip:hover{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td.m{font-family:var(--f-mono)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.hl td{background:var(--accent-soft)}
.tbl td.rootc{color:var(--root);font-weight:700}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.good{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.tag.bad{color:var(--bad);border-color:currentColor}
.status{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:1.5em}
.status.warn{color:var(--warn)}
/* keyboard */
.kbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
svg.kbd{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:none}
svg.kbd.small{min-width:0}
.key-w{fill:var(--key-w);stroke:var(--key-edge);stroke-width:1}
.key-b{fill:var(--key-b);stroke:var(--key-b)}
.key-w.tone,.key-b.tone{fill:var(--accent)}
.key-w.root,.key-b.root{fill:var(--root)}
.key-w.sel,.key-b.sel{fill:var(--accent)}
.key-w.press,.key-b.press{fill:var(--press)}
svg.kbd g{cursor:pointer}
.kl{font-family:var(--f-mono);font-size:11px;font-weight:600;fill:var(--key-label);text-anchor:middle;pointer-events:none}
.kl.on{fill:var(--on-accent)}
.kl.b{font-size:9px}
.kh{font-family:var(--f-mono);font-size:10px;fill:var(--key-label);text-anchor:middle;pointer-events:none;text-transform:uppercase}
.kh.b{fill:#9aa1b0}
svg.small .kl{font-size:0}
/* fretboard */
svg.fb{display:block;width:100%;height:auto;user-select:none}
.fb-wood{fill:var(--wood)}
.fb-fret{stroke:var(--fret);stroke-width:2}
.fb-nut{stroke:var(--ink);stroke-width:5}
.fb-str{stroke:var(--string)}
.fb-inlay{fill:var(--inlay)}
.fb-num{font-family:var(--f-mono);font-size:10px;fill:var(--muted);text-anchor:middle}
.fn circle{fill:var(--surface);stroke:var(--line);stroke-width:1}
.fn text{font-family:var(--f-mono);font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:central;fill:var(--ink);pointer-events:none}
.fn.tone circle{fill:var(--accent);stroke:var(--accent)} .fn.tone text{fill:var(--on-accent)}
.fn.root circle{fill:var(--root);stroke:var(--root)} .fn.root text{fill:var(--on-accent)}
.fn.hi circle{fill:var(--accent);stroke:var(--accent)} .fn.hi text{fill:var(--on-accent)}
.fn.dim{opacity:.22}
.fn{cursor:pointer}
.fn.press circle{fill:var(--press);stroke:var(--press)}
/* chord diagrams */
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.dg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:10px 8px 6px;cursor:pointer;text-align:center}
.dg:hover{border-color:var(--accent)}
.dg .t{font-family:var(--f-mono);font-weight:600;font-size:14px}
.dg .s{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.dg svg{width:100%;max-width:130px;height:auto;display:block;margin:4px auto 0}
.cd-line{stroke:var(--muted);stroke-width:1}
.cd-nut{stroke:var(--ink);stroke-width:4}
.cd-dot{fill:var(--accent)} .cd-dot.r{fill:var(--root)}
.cd-t{font-family:var(--f-mono);font-size:10px;fill:var(--muted);text-anchor:middle}
.cd-o{fill:none;stroke:var(--ink);stroke-width:1.3}
.cd-x{stroke:var(--muted);stroke-width:1.4}
.cd-barre{fill:var(--accent)}
.cards12{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card12{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card12:hover{border-color:var(--accent)}
.card12 .t{font-family:var(--f-mono);font-weight:600;font-size:16px}
.card12 .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card12 svg.cdg{width:100%;max-width:120px;margin:0 auto;display:block;height:auto}
/* circle */
.cs{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
.cs.maj{fill:var(--surface-2)} .cs.min{fill:var(--bg)}
.cs.fam{fill:var(--accent-soft)}
.cs.dimk{fill:var(--root-soft)}
.cs.on{fill:var(--accent)}
.cs:hover{filter:brightness(.96)}
.ct{text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--ink)}
.ct.maj{font-family:var(--f-display);font-size:22px}
.ct.min{font-family:var(--f-body);font-size:12.5px;font-weight:600}
.ct.sig{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.ct.on{fill:var(--on-accent)}
.c-hub{fill:var(--surface);stroke:var(--line)}
.ct.hub{font-family:var(--f-display);font-size:26px}
.ct.hub2{font-size:11px;fill:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cof-panel svg{width:100%;max-width:520px;display:block;margin:0 auto;height:auto}
.staff line{stroke:var(--muted);stroke-width:1}
.staff text{font-size:20px;fill:var(--ink);font-family:var(--f-body)}
/* tuner */
.tuner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.tn-note{font-family:var(--f-display);font-size:96px;line-height:1;letter-spacing:-.02em;min-height:96px}
.tn-note sub{font-family:var(--f-mono);font-size:22px;vertical-align:baseline;margin-left:2px;color:var(--muted)}
.tn-sub{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
svg.gauge{width:100%;max-width:420px;height:auto}
.g-arc{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
.g-ok{fill:none;stroke:var(--good);stroke-width:14;opacity:.55}
.g-tick{stroke:var(--muted);stroke-width:1.5}
.g-lab{font-family:var(--f-mono);font-size:10px;fill:var(--muted);text-anchor:middle}
.needle{transition:transform .12s ease-out;transform-origin:150px 150px}
.needle line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.needle circle{fill:var(--ink)}
.needle.ok line,.needle.ok circle{stroke:var(--good);fill:var(--good)}
.tn-dir{font-weight:700;font-size:15px;min-height:1.5em}
.tn-dir.ok{color:var(--good)} .tn-dir.off{color:var(--warn)}
.strings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.strbtn{min-width:62px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-family:var(--f-mono);font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.strbtn small{font-size:10px;color:var(--muted);font-weight:500}
.strbtn.target{border-color:var(--accent);background:var(--accent-soft)}
.strbtn.tuned small{color:var(--good)}
canvas.trace{width:100%;height:320px;display:block;border-radius:8px;background:var(--surface-2)}
/* beat maker */
.seq{display:grid;grid-template-columns:110px repeat(16,minmax(30px,1fr));gap:4px;min-width:640px}
.seq .lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;padding-right:4px;white-space:nowrap}
.seq .lab.muted-row{opacity:.4}
.step{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0}
.step.q{background:var(--bg)}
.step.on{background:var(--accent);border-color:var(--accent)}
.step.ph{box-shadow:0 0 0 2px var(--root) inset}
.step.on.ph{background:var(--root);border-color:var(--root)}
.seq .num{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center}
textarea.sheet{width:100%;min-height:300px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical;white-space:pre;overflow-x:auto}
pre.sheet{margin:0;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-height:300px;overflow-x:auto}
pre.sheet .c{color:var(--accent);font-weight:600}
.sheetgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
/* cheat sheet */
.cheat{columns:3 300px;column-gap:18px}
.cheat .panel{break-inside:avoid;margin-bottom:18px;display:block}
.cheat table{width:100%;border-collapse:collapse;font-size:13.5px}
.cheat td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.cheat td:first-child{font-family:var(--f-mono);font-weight:600;padding-right:12px;white-space:nowrap}
.cheat p{margin:0 0 8px;font-size:14px}
.big-seq{font-family:var(--f-mono);font-size:18px;font-weight:600;letter-spacing:.12em}
.quiz-score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.ans .btn.right{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.ans .btn.wrong{border-color:var(--bad);color:var(--bad)}
.scrim{display:none}
@media (max-width:900px){
  .split,.grid2,.sheetgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.18)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:35}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);font-weight:400;font-size:24px}
  main{padding-block:20px 60px}
  .tn-note{font-size:76px;min-height:76px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="topbar"><b>Tonebench</b><button class="btn sm" id="menuBtn" aria-controls="side" aria-expanded="false">All tools</button></div>
<div class="app">
  <nav class="side" id="side" aria-label="Tools"></nav>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ================= Theory core ================= */
const LETTERS=['C','D','E','F','G','A','B'], LPC=[0,2,4,5,7,9,11];
const PREF=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ROOTS=['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];
const mod=(n,m=12)=>((n%m)+m)%m;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function pcOf(n){let p=LPC[LETTERS.indexOf(n[0])];for(const c of n.slice(1))p+=c==='#'?1:c==='x'?2:c==='b'?-1:0;return mod(p);}
const accS=n=>n===0?'':n>0?'#'.repeat(n):'b'.repeat(-n);
function deg(d){const m=/^([b#]*)(\d+)$/.exec(d);let a=0;for(const c of m[1])a+=c==='#'?1:-1;const n=+m[2];return{semi:LPC[(n-1)%7]+12*Math.floor((n-1)/7)+a,step:(n-1)%7};}
function spellDeg(root,d){const rl=LETTERS.indexOf(root[0]),rp=pcOf(root);const {semi,step}=deg(d);const L=(rl+step)%7;let a=mod(rp+semi-LPC[L]);if(a>6)a-=12;return LETTERS[L]+accS(a);}
const spell=(root,degs)=>degs.map(d=>spellDeg(root,d));
const P=n=>n?n[0]+n.slice(1).replace(/#/g,'♯').replace(/b/g,'♭'):'';
const PD=d=>d.replace(/#/g,'♯').replace(/b/g,'♭');
const accCount=ns=>ns.reduce((s,n)=>s+n.slice(1).replace(/[^#b]/g,'').length,0);
function bestRoot(pc,degs){const c=ROOTS.filter(r=>pcOf(r)===pc);let best=PREF[pc],bs=1e9;for(const r of c){const s=accCount(spell(r,degs))+(r===PREF[pc]?-.5:0);if(s<bs){bs=s;best=r;}}return best;}
const voiced=(root,degs,base=48)=>degs.map(d=>base+pcOf(root)+deg(d).semi);
const isW=m=>[0,2,4,5,7,9,11].includes(mod(m));
const nameOct=m=>P(PREF[mod(m)])+(Math.floor(m/12)-1);
const S=s=>s.trim().split(/\s+/);

const SCALES=[

 const g=a.createGain();g.gain.setValueAtTime(0,t);const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(14000,f*10);lp.Q.value=.3;g.connect(lp);lp.connect(MASTER);
 const oscs=[];const add=(type,mult,gain,det=0)=>{const o=a.createOscillator();o.type=type;o.frequency.value=f*mult;o.detune.value=det;const og=a.createGain();og.gain.value=gain;o.connect(og);og.connect(g);o.start(t);oscs.push(o);};
 const pk=.26*vel;const dk=Math.max(.25,.7-(midi-48)/90);
 if(sound==='organ'){add('sine',1,1);add('sine',2,.5);add('sine',3,.25);add('sine',.5,.35);g.gain.linearRampToValueAtTime(pk*.6,t+.02);}
 else if(sound==='synth'){add('sawtooth',1,.5,-7);add('sawtooth',1,.5,7);lp.frequency.setValueAtTime(f*8,t);lp.frequency.setTargetAtTime(f*2.5,t,.3);g.gain.linearRampToValueAtTime(pk*.7,t+.01);g.gain.setTargetAtTime(pk*.45,t+.02,.3);}
 else if(sound==='keys'){add('sine',1,1);add('sine',2,.15);add('sine',7,.05);g.gain.linearRampToValueAtTime(pk,t+.004);g.gain.setTargetAtTime(pk*.08,t+.01,dk*1.6);}
 else if(sound==='string'){add('sawtooth',1,.45);add('triangle',1,.7);add('sine',2,.2);lp.frequency.setValueAtTime(Math.min(12000,f*9),t);lp.frequency.setTargetAtTime(f*1.6,t,.18);g.gain.linearRampToValueAtTime(pk,t+.003);g.gain.setTargetAtTime(0,t+.01,dk*1.3);}
 else {add('triangle',1,1);add('sine',2,.35);add('sine',3,.09);add('sine',4,.04);g.gain.linearRampToValueAtTime(pk,t+.004);g.gain.setTargetAtTime(pk*.22,t+.01,dk*.5);g.gain.setTargetAtTime(0.0001,t+1.2,dk*2.2);}

}

const VCACHE=new Map();
function findVoicings(tuning,ch,rootPc,max=8){
 const key=tuning.join(',')+'|'+ch.id+'|'+rootPc+'|'+max;if(VCACHE.has(key))return VCACHE.get(key);
 const n=tuning.length,degs=ch.degs,pcs=degs.map(d=>mod(rootPc+deg(d).semi));
 const optional=new Set();if(pcs.length>3&&degs.includes('5'))optional.add(pcs[degs.indexOf('5')]);
 if(pcs.length>=6){if(degs.includes('9'))optional.add(pcs[degs.indexOf('9')]);if(degs.includes('13')&&degs.includes('11'))optional.add(pcs[degs.indexOf('11')]);}
 if(n===4&&pcs.length>=5){optional.add(pcs[0]);}
 const req=[...new Set(pcs)].filter(p=>!optional.has(p));const rootBass=n>=5;const minSound=n>=5?4:3;
 const seen=new Set(),out=[];
 function ev(v){const k=v.join(',');if(seen.has(k))return;seen.add(k);
  const snd=[];for(let i=0;i<n;i++)if(v[i]>=0)snd.push(i);if(snd.length<minSound)return;
  if(snd[snd.length-1]-snd[0]+1!==snd.length)return;
  if(rootBass&&snd[snd.length-1]<n-2)return;
  const notes=snd.map(i=>tuning[i]+v[i]),got=new Set(notes.map(x=>mod(x)));
  for(const p of req)if(!got.has(p))return;
  if(rootBass&&mod(notes[0])!==rootPc)return;
  const fr=snd.filter(i=>v[i]>0).map(i=>v[i]);const minF=fr.length?Math.min(...fr):0,maxF=fr.length?Math.max(...fr):0;if(maxF-minF>3)return;
  let fingers=fr.length,barre=false;const at=snd.filter(i=>v[i]===minF&&minF>0);
  if(at.length>=2){let ok=true;for(let i=at[0];i<=at[at.length-1];i++)if(v[i]<minF)ok=false;if(ok){barre=true;fingers=fr.length-at.length+1;}}
  if(fingers>4)return;
  const opens=snd.filter(i=>v[i]===0).length,missing=pcs.filter(p=>!got.has(p)).length,mutes=n-snd.length;
  const score=minF*.9+(maxF-minF)*1.2+fingers*.6+missing*2.5+mutes*.8-snd.length*.4+(barre?1.2:0)+(maxF<=3?-opens*.4:opens*1.6);
  out.push({v:v.slice(),score,minF,barre});}
 for(let s=1;s<=12;s++){const hi=s+3;const opts=tuning.map(o=>{const r=[-1];for(let f=0;f<=hi;f++){if(f>0&&f<s)continue;if(pcs.includes(mod(o+f)))r.push(f);}return r;});
  const cur=new Array(n);(function rec(i){if(i===n){ev(cur);return;}for(const f of opts[i]){cur[i]=f;rec(i+1);}})(0);}
 out.sort((a,b)=>a.score-b.score);const res=[],ks=new Set();
 for(const o of out){const k=o.minF+'|'+o.v.findIndex(f=>f>=0);if(ks.has(k))continue;ks.add(k);res.push(o);if(res.length>=max)break;}
 VCACHE.set(key,res);return res;
}

 const base=maxF<=4?1:minF,rows=4,SW=n>=6?16:n===4?22:18,FH=20,Lp=24,T=22;const W=Lp*2+(n-1)*SW,H=T+rows*FH+20;

 if(base>1)s+=`<text class="cd-t" x="${Lp-12}" y="${T+FH*.5+4}">${base}fr</text>`;
 const at=[];v.forEach((f,i)=>{if(f===minF&&minF>0)at.push(i);});

 const MAJL=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'],MINL=['Am','Em','Bm','F♯m','C♯m','G♯m','D♯m','B♭m','Fm','Cm','Gm','Dm'];

 el.insertAdjacentHTML('beforeend',`<div class="split"><div class="panel cof-panel"><svg id="cof" viewBox="0 0 400 400" role="img" aria-label="Circle of fifths"></svg><p class="hint">Click a segment to hear its chord. Tinted segments are the key's diatonic chords; the warm one is the diminished chord.</p></div><div class="panel" id="cofInfo"></div></div>`);
 const svg=$('#cof',el),info=$('#cofInfo',el);
 const pt=(r,a)=>{const t=a*Math.PI/180;return [(200+r*Math.sin(t)).toFixed(2),(200-r*Math.cos(t)).toFixed(2)];};
 const seg=(r1,r2,a0,a1)=>{const [x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0);return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;};
 function draw(){const k=sel.k,fam=[mod(k-1),k,mod(k+1)];let s='';
  for(let i=0;i<12;i++){const a0=i*30-15+.7,a1=i*30+15-.7,onM=!sel.minor&&i===k,onm=sel.minor&&i===k;
   s+=`<path class="cs maj ${fam.includes(i)?'fam':''} ${onM?'on':''}" d="${seg(140,196,a0,a1)}" data-k="${i}" data-r="M"><title>${MAJL[i]} major</title></path>`;
   s+=`<path class="cs min ${fam.includes(i)?'fam':''} ${i===mod(k+2)?'dimk':''} ${onm?'on':''}" d="${seg(94,138,a0,a1)}" data-k="${i}" data-r="m"><title>${MINL[i]}</title></path>`;
   const [tx,ty]=pt(168,i*30),[mx,my]=pt(116,i*30),[sx,sy]=pt(78,i*30);
   s+=`<text class="ct maj ${onM?'on':''}" x="${tx}" y="${ty}">${MAJL[i]}</text><text class="ct min ${onm?'on':''}" x="${mx}" y="${my}">${MINL[i]}</text><text class="ct sig" x="${sx}" y="${sy}">${i===0?'0':i<=6?i+'♯':(12-i)+'♭'}</text>`;}
  s+=`<circle cx="200" cy="200" r="60" class="c-hub"/><text class="ct hub" x="200" y="194">${sel.minor?MINL[k]:MAJL[k]}</text><text class="ct hub2" x="200" y="218">${sel.minor?'minor':'major'}</text>`;
  svg.innerHTML=s;renderInfo();}
 function renderInfo(){const k=sel.k,tonic=sel.minor?MIN[k]:MAJ[k],degs=(sel.minor?SC.natural_minor:SC.major).degs;
  const notes=spell(tonic,degs),chs=diatonic(tonic,degs),n=k<=6?k:12-k,type=k===0?'none':k<=6?'sharp':'flat';
  const accs=type==='sharp'?['F','C','G','D','A','E','B'].slice(0,n).map(x=>x+'#'):type==='flat'?['B','E','A','D','G','C','F'].slice(0,n).map(x=>x+'b'):[];

  info.innerHTML=`<div class="big">${P(tonic)} ${sel.minor?'minor':'major'}</div>
   <p class="muted" style="margin:6px 0 4px">${n===0?'No sharps or flats':n+' '+type+(n>1?'s':'')+': <span class="mono">'+accs.map(P).join(' ')+'</span>'}</p>

  const mid=voiced(tonic,degs.concat(['8']));

 svg.addEventListener('click',e=>{const p=e.target.closest('path[data-k]');if(!p)return;sel={k:+p.dataset.k,minor:p.dataset.r==='m'};draw();
  const tonic=sel.minor?MIN[sel.k]:MAJ[sel.k];playNotes(voiced(tonic,sel.minor?['1','b3','5']:['1','3','5'],pcOf(tonic)>=7?36+12:48),{dur:1.2});});

/* ---------- Pitch engine ---------- */
function detectPitch(buf,sr){let n=buf.length,rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);if(rms<.01)return -1;
 let r1=0,r2=n-1;const th=.2;for(let i=0;i<n/2;i++)if(Math.abs(buf[i])<th){r1=i;break;}for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break;}
 const b=buf.slice(r1,r2);n=b.length;const c=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<n-i;j++)s+=b[j]*b[j+i];c[i]=s;}
 let d=0;while(d<n-1&&c[d]>c[d+1])d++;let mv=-1,mp=-1;for(let i=d;i<n;i++)if(c[i]>mv){mv=c[i];mp=i;}if(mp<=0||mp>=n-1)return -1;
 const x1=c[mp-1],x2=c[mp],x3=c[mp+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;const T0=a?mp-bb/(2*a):mp;return sr/T0;}
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1];};
function smoother(){let h=[],last=0;return f=>{const now=performance.now();if(f==null){if(now-last>400)h=[];return h.length?median(h):null;}last=now;if(h.length&&Math.abs(12*Math.log2(f/median(h)))>.7)h=[];h.push(f);if(h.length>5)h.shift();return median(h);};}
const Pitch={
 _attach(node,cb,onEnd){const a=ac();const an=a.createAnalyser();an.fftSize=2048;node.connect(an);const z=a.createGain();z.gain.value=0;an.connect(z);z.connect(a.destination);this.an=an;this.sink=z;this.node=node;this.onEnd=onEnd;const buf=new Float32Array(an.fftSize);
  this.timer=setInterval(()=>{an.getFloatTimeDomainData(buf);const f=detectPitch(buf,a.sampleRate);cb(f>28&&f<1800?f:null);},50);},
 async startMic(cb,onEnd){this.stop();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomic');const a=ac();const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});this.stream=st;this._attach(a.createMediaStreamSource(st),cb,onEnd);},
 async startFile(file,cb,onEnd){this.stop();const a=ac();const data=await a.decodeAudioData(await file.arrayBuffer());const src=a.createBufferSource();src.buffer=data;const g=a.createGain();g.gain.value=.7;src.connect(g);g.connect(MASTER);this.src=src;src.onended=()=>{if(this.src===src)this.stop();};this._attach(src,cb,onEnd);src.start();},
 startDemo(cb,fn,onEnd){this.stop();const a=ac();const o=a.createOscillator();o.type='sawtooth';const g=a.createGain();g.gain.value=0;o.connect(g);o.start();this.osc=o;const t0=a.currentTime;
  const tick=()=>{const v=fn(a.currentTime-t0);if(v==null)g.gain.setTargetAtTime(0,a.currentTime,.01);else{g.gain.setTargetAtTime(.5,a.currentTime,.01);o.frequency.setTargetAtTime(v,a.currentTime,.015);}};tick();this.demo=setInterval(tick,25);this._attach(g,cb,onEnd);},
 stop(){clearInterval(this.timer);clearInterval(this.demo);this.timer=this.demo=null;if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}
  if(this.src){const s=this.src;this.src=null;try{s.stop()}catch(e){}}if(this.osc){try{this.osc.stop()}catch(e){}this.osc=null;}
  for(const k of ['node','sink']){if(this[k]){try{this[k].disconnect()}catch(e){}this[k]=null;}}const cb=this.onEnd;this.onEnd=null;if(cb)cb();}
};
function noteInfo(f){const mf=69+12*Math.log2(f/A4),m=Math.round(mf);return {midi:m,mf,cents:(mf-m)*100,sharp:SHARP[mod(m)],flat:FLAT[mod(m)],oct:Math.floor(m/12)-1};}
function gaugeSVG(){let s=`<svg class="gauge" viewBox="0 0 300 175" role="img" aria-label="Cents meter"><path class="g-arc" d="M${150-120*Math.sin(Math.PI/3)} ${150-120*Math.cos(Math.PI/3)}A120 120 0 0 1 ${150+120*Math.sin(Math.PI/3)} ${150-120*Math.cos(Math.PI/3)}"/>`;
 const p=(c,r)=>{const t=c*1.2*Math.PI/180;return [150+r*Math.sin(t),150-r*Math.cos(t)];};const [a1,b1]=p(-5,120),[a2,b2]=p(5,120);s+=`<path class="g-ok" d="M${a1} ${b1}A120 120 0 0 1 ${a2} ${b2}"/>`;
 for(let c=-50;c<=50;c+=10){const [x1,y1]=p(c,104),[x2,y2]=p(c,c%50===0||c===0?92:97),[lx,ly]=p(c,80);s+=`<line class="g-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;if(c%25===0||c===0)s+=`<text class="g-lab" x="${lx}" y="${ly+3}">${c>0?'+'+c:c}</text>`;}
 s+=`<text class="g-lab" x="40" y="170">flat</text><text class="g-lab" x="260" y="170">sharp</text><g class="needle"><line x1="150" y1="150" x2="150" y2="38"/><circle cx="150" cy="150" r="7"/></g></svg>`;return s;}
function setNeedle(host,c){const n=$('.needle',host);if(!n)return;if(c==null){n.style.transform='rotate(0deg)';n.style.opacity=.3;n.classList.remove('ok');return;}n.style.opacity=1;n.style.transform=`rotate(${Math.max(-55,Math.min(55,c))*1.2}deg)`;n.classList.toggle('ok',Math.abs(c)<=5);}
function sourceUI(host,onPitch,demoFn){
 host.innerHTML=`<div class="btns" style="justify-content:center"><button class="btn primary" data-a="mic">Listen with microphone</button><label class="btn" tabindex="0">Analyze a recording<input type="file" accept="audio/*" hidden></label><button class="btn" data-a="demo">Run demo signal</button><button class="btn" data-a="stop" hidden>Stop</button></div><p class="status"></p>`;
 const st=$('.status',host),stop=$('[data-a=stop]',host);
 const idle=()=>{stop.hidden=true;onPitch(null,true);if(!st.classList.contains('warn'))st.textContent='Idle. Pick a source above to start.';};
 const run=t=>{stop.hidden=false;st.className='status';st.textContent=t;};
 idle();
 $('[data-a=mic]',host).onclick=async()=>{try{await Pitch.startMic(onPitch,idle);run('Listening to your microphone. Play or sing one note at a time.');}catch(e){st.className='status warn';st.textContent='The microphone isn’t available here, so live listening can’t start. Record yourself on your phone and use “Analyze a recording”, or try the demo signal.';}};
 $('input[type=file]',host).onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{st.className='status';st.textContent='Decoding…';await Pitch.startFile(f,onPitch,idle);run('Playing and analyzing “'+f.name+'”.');}catch(err){st.className='status warn';st.textContent='That file couldn’t be decoded. Try an MP3, WAV, M4A or OGG recording.';}};
 $('[data-a=demo]',host).onclick=()=>{Pitch.startDemo(onPitch,demoFn,idle);run('Demo signal running silently: a slightly out-of-tune note drifting toward pitch.');};
 stop.onclick=()=>Pitch.stop();
}
function a4Field(){return `<label class="fld" for="a4"><span>Calibrate A4 (Hz)</span><input id="a4" type="number" min="415" max="466" step="1" value="${A4}"></label>`;}
function bindA4(el){const i=$('#a4',el);if(i)i.onchange=()=>{const v=+i.value;if(v>=415&&v<=466)A4=v;else i.value=A4;};}
let DRONE=null;
function drone(midi){stopDrone();const a=ac();const g=a.createGain();g.gain.value=0;g.gain.setTargetAtTime(.18,a.currentTime,.05);g.connect(MASTER);const os=[1,2].map((m,i)=>{const o=a.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=mtof(midi)*m;const og=a.createGain();og.gain.value=i?.3:1;o.connect(og);og.connect(g);o.start();return o;});DRONE={g,os};}
function stopDrone(){if(!DRONE)return;const a=ac();DRONE.g.gain.setTargetAtTime(0,a.currentTime,.05);const d=DRONE;setTimeout(()=>d.os.forEach(o=>{try{o.stop()}catch(e){}}),400);DRONE=null;}

 el.insertAdjacentHTML('beforeend',`<div class="split"><div class="panel tuner"><div class="tn-note" id="tNote">–</div><div class="tn-sub" id="tSub">no signal</div>${gaugeSVG()}<div class="tn-dir" id="tDir"></div><div id="tSrc" style="width:100%"></div></div>
 <div class="panel"><h3>Reference tone</h3><div class="controls">${fld('Note','rtN',PREF.map((n,i)=>[i,P(n)]),9)}${fld('Octave','rtO',[2,3,4,5],4)}<button class="btn" id="rtPlay">Play tone</button><button class="btn" id="rtStop">Stop</button></div>
 <h3 style="margin-top:22px">Settings</h3><div class="controls">${a4Field()}</div><p class="hint">Most bands tune to A4 = 440 Hz. Some orchestras use 442.</p>
 <h3 style="margin-top:22px">Reading the meter</h3><p class="muted" style="margin:0">The needle shows cents, hundredths of a semitone. Inside the green band (±5 cents) most ears hear the note as in tune.</p></div></div>`);

 sourceUI($('#tSrc',el),(f,reset)=>{const v=reset?null:sm(f);if(v==null){$('#tNote',el).innerHTML='–';$('#tSub',el).textContent='no signal';$('#tDir',el).textContent='';setNeedle(el,null);return;}
  const n=noteInfo(v);$('#tNote',el).innerHTML=`${P(n.sharp)}<sub>${n.oct}</sub>`;$('#tSub',el).textContent=`${v.toFixed(1)} Hz · ${n.cents>=0?'+':''}${n.cents.toFixed(0)} cents${n.sharp!==n.flat?' · '+P(n.flat):''}`;
  setNeedle(el,n.cents);const d=$('#tDir',el);if(Math.abs(n.cents)<=5){d.textContent='In tune';d.className='tn-dir ok';}else{d.textContent=n.cents<0?'Flat · tune up':'Sharp · tune down';d.className='tn-dir off';}},
  t=>{const base=196*2**(((t%9)<4.5?-28:16)*Math.max(0,1-(t%4.5)/3.5)/1200);return (t%9)<4.5?base:base*1.122;});
 $('#rtPlay',el).onclick=()=>drone(12*(+$('#rtO',el).value+1)+ +$('#rtN',el).value);$('#rtStop',el).onclick=stopDrone;
 return ()=>{Pitch.stop();stopDrone();};

function fretView(el,{inst,show='notes',root='C',scale='major',chord='maj',positions=false,fretsDef=15}){
 const fretOpts=inst==='ukulele'?[12,15,18]:inst==='bass'?[12,20,24]:[12,15,22,24];

 ${fld('Root','fR',rootOpts,root)}<span id="fScW">${fld('Scale','fSc',scaleOpts,scale)}</span><span id="fChW">${fld('Chord','fCh',chordOpts,chord)}</span>
 ${fld('Labels','fL',[['name','Note names'],['int','Intervals']],'name')}${positions?fld('Position','fP',[],'all'):''}${fld('Frets','fF',fretOpts,fretsDef)}
 ${positions?'<button class="btn primary" id="fPlay">Play scale</button>':''}</div>
 <div class="controls" style="margin:16px 0 10px;justify-content:space-between"><div class="big" id="fName" style="font-size:30px"></div><div class="chips" id="fNotes"></div></div>
 <div class="scroll" id="fB"></div><p class="hint" id="fHint">Click any note to hear it.</p></div>`);
 const showSel=()=>positions?'scale':$('#fS',el).value;
 function upd(){const tun=FT[inst][+$('#fT',el).value][1],frets=+$('#fF',el).value,mode=showSel(),root=$('#fR',el).value;
  $('#fScW',el).hidden=mode!=='scale';$('#fChW',el).hidden=mode!=='chord';$('#fR',el).closest('.fld').hidden=mode==='notes'||mode==='naturals';$('#fL',el).closest('.fld').hidden=mode==='notes'||mode==='naturals';
  let map=null,title,degs=null;
  if(mode==='scale'||mode==='chord'){const obj=mode==='scale'?SC[$('#fSc',el).value]:CH[$('#fCh',el).value];degs=obj.degs;const names=spell(root,degs);map={};degs.forEach((d,i)=>map[mod(pcOf(root)+deg(d).semi)]={name:names[i],d,root:i===0});
   title=mode==='scale'?P(root)+' '+obj.name.toLowerCase():chordName(root,obj);$('#fNotes',el).innerHTML=names.map((n,i)=>`<span class="chip ${i===0?'root':''}">${P(n)}<small>${PD(degs[i])}</small></span>`).join('');}
  else{title=mode==='notes'?'Every note':'Natural notes';$('#fNotes',el).innerHTML='';}
  $('#fName',el).textContent=title+' · '+FT[inst][+$('#fT',el).value][0].split(' (')[0];
  let win=null;if(positions){const sel=$('#fP',el);const low=tun[0];const starts=[];for(let f=0;f<=12;f++)if(map[mod(low+f)])starts.push(f);const prev=sel.value;sel.innerHTML=opts([['all','Whole neck']].concat(starts.map((f,i)=>[f,`Position ${i+1} · frets ${f}–${f+4}`])),prev);if(![...sel.options].some(o=>o.value===prev))sel.value='all';win=sel.value==='all'?null:+sel.value;}
  const lab=$('#fL',el).value;
  $('#fB',el).innerHTML=fretSVG(tun,frets,(m,s,f)=>{const pc=mod(m);
   if(mode==='notes')return {label:P(PREF[pc]),cls:isW(pc)?'':'dim'};
   if(mode==='naturals')return isW(pc)?{label:PREF[pc],cls:pc===0?'root':''}:null;
   const it=map[pc];if(!it)return null;let cls=it.root?'root':'tone';if(win!=null&&(f<win||f>win+4))cls+=' dim';return {label:lab==='int'?(it.root?'R':PD(it.d)):P(it.name),cls};});}
 $$('select',el).forEach(s=>s.onchange=upd);upd();bindFretClicks($('#fB',el),'string');
 if(positions)$('#fPlay',el).onclick=()=>{const tun=FT[inst][+$('#fT',el).value][1];const root=$('#fR',el).value;const degs=SC[$('#fSc',el).value].degs;let b=tun[0];while(mod(b)!==pcOf(root))b++;const win=$('#fP',el).value;if(win!=='all'){while(b<tun[0]+ +win)b+=12;}
  const seq=degs.map(d=>b+deg(d).semi).concat([b+12]);clearTimers();playSeq(seq.concat(seq.slice(0,-1).reverse()),{gap:.28,dur:.5,sound:'string',svg:null});};

view('transposer','Harmony','Chord Transposer','Paste a chord sheet and move it to any key. Chord lines keep their alignment over the lyrics, and inline [bracket] chords work too.',el=>{
 const SAMPLE=`Harbor Lights (example sheet)

[Verse]
G          D/F#        Em7        Cadd9
Morning rolls in slow across the water
G          D            C
Gulls are calling out the tide

[Chorus]
C       D        Em      G/B
Hold the line, hold the light
Am7          D7sus4    D7     G
Bring me home before the [C]night

[Bridge]
Em  Bm  | C  G  | Am  D  | Gmaj7`;
 el.insertAdjacentHTML('beforeend',`<div class="panel"><div class="controls">
 <div class="fld"><span>Semitones</span><div class="btns"><button class="btn sm" id="tDn" aria-label="Down a semitone">−</button><span class="mono" id="tN" style="align-self:center;min-width:34px;text-align:center">0</span><button class="btn sm" id="tUp" aria-label="Up a semitone">+</button></div></div>
 ${fld('Or move to key','tK',[['','—']].concat(PREF.map((n,i)=>[i,P(n)])),'')}${fld('Spelling','tSp',[['auto','Match new key'],['sharp','Sharps'],['flat','Flats']],'auto')}<button class="btn" id="tCopy">Copy result</button><button class="btn" id="tReset">Load example</button></div>
 <p class="status" id="tInfo"></p></div>
 <div class="sheetgrid"><div class="panel"><h3>Original</h3><textarea class="sheet" id="tIn" spellcheck="false" aria-label="Original chord sheet"></textarea></div><div class="panel"><h3>Transposed</h3><pre class="sheet" id="tOut"></pre></div></div>`);
 const RE=/^([A-G])([#b]?)((?:maj|min|dim|aug|sus|add|m|M|\+|°|ø|-|\d|b|#|\(|\))*)(?:\/([A-G])([#b]?))?$/;
 const SKIP=new Set(['|','||','-','/','N.C.','NC','x2','x3','x4','(x2)','(x3)','(x4)','%']);
 let n=0;const ta=$('#tIn',el);ta.value=SAMPLE;
 const isChord=t=>RE.test(t);const isLine=l=>{const ts=l.trim().split(/\s+/).filter(t=>t&&!SKIP.has(t));return ts.length>0&&ts.every(isChord);};
 const flatKey=(pc,minor)=>minor?[2,7,0,5,10,3].includes(pc):[5,10,3,8,1].includes(pc);
 function firstChord(txt){for(const l of txt.split('\n')){if(isLine(l)){const t=l.trim().split(/\s+/).find(isChord);if(t)return t;}const b=/\[([^\]]+)\]/.exec(l);if(b&&isChord(b[1]))return b[1];}return null;}
 function run(){const txt=ta.value,fc=firstChord(txt);let useFlat=false;
  if(fc){const m=RE.exec(fc);const pc=mod(pcOf(m[1]+m[2])+n);const minor=/^m(?!aj)/.test(m[3]);const sp=$('#tSp',el).value;useFlat=sp==='flat'||(sp==='auto'&&flatKey(pc,minor));
   const nk=(useFlat?FLAT:SHARP)[pc];$('#tInfo',el).innerHTML=`Original key: <b>${P(m[1]+m[2])}${minor?'m':''}</b> → New key: <b>${P(nk)}${minor?'m':''}</b>${capo(pc,minor)}`;}
  else $('#tInfo',el).textContent='No chords found yet. Put chords on their own lines above the lyrics, or inline like [Am].';
  const tr=t=>{const m=RE.exec(t);if(!m)return t;const nm=x=>(useFlat?FLAT:SHARP)[mod(pcOf(x)+n)];return nm(m[1]+m[2])+m[3]+(m[4]?'/'+nm(m[4]+(m[5]||'')):'');};
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const out=txt.split('\n').map(l=>{if(isLine(l)){let o='',last=0,debt=0;l.replace(/\S+/g,(tok,idx)=>{let gap=l.slice(last,idx);if(debt>0){const cut=Math.min(debt,Math.max(0,gap.length-1));gap=gap.slice(cut);debt-=cut;}else if(debt<0&&last>0){gap+=' '.repeat(-debt);debt=0;}
    const nt=isChord(tok)?tr(tok):tok;o+=esc(gap)+(isChord(tok)?`<span class="c">${esc(nt)}</span>`:esc(nt));debt+=nt.length-tok.length;last=idx+tok.length;return tok;});return o+esc(l.slice(last));}
   return esc(l).replace(/\[([^\]]+)\]/g,(all,c)=>isChord(c)?`[<span class="c">${esc(tr(c))}</span>]`:all);}).join('\n');
  $('#tOut',el).innerHTML=out;$('#tN',el).textContent=(n>0?'+':'')+n;}
 function capo(pc,minor){const easy=minor?{9:'Am',4:'Em',2:'Dm'}:{0:'C',7:'G',2:'D',9:'A',4:'E'};const s=[];for(let c=1;c<=7;c++){const sh=mod(pc-c);if(easy[sh])s.push(`capo ${c} with ${easy[sh]} shapes`);}return s.length?` · Guitar: ${s.slice(0,2).join(' or ')}`:'';}
 ta.oninput=run;$('#tUp',el).onclick=()=>{n=n>=11?0:n+1;$('#tK',el).value='';run();};$('#tDn',el).onclick=()=>{n=n<=-11?0:n-1;$('#tK',el).value='';run();};
 $('#tK',el).onchange=e=>{if(e.target.value==='')return;const fc=firstChord(ta.value);if(!fc)return;const m=RE.exec(fc);let d=mod(+e.target.value-pcOf(m[1]+m[2]));if(d>6)d-=12;n=d;run();};
 $('#tSp',el).onchange=run;$('#tReset',el).onclick=()=>{ta.value=SAMPLE;n=0;run();};
 $('#tCopy',el).onclick=async()=>{const txt=$('#tOut',el).textContent;try{await navigator.clipboard.writeText(txt);$('#tCopy',el).textContent='Copied';setTimeout(()=>$('#tCopy',el).textContent='Copy result',1500);}catch(e){const r=document.createRange();r.selectNodeContents($('#tOut',el));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#tCopy',el).textContent='Selected, press Ctrl+C';}};
 run();
});

/* ---------- Beat maker ---------- */
function noiseBuf(){const a=ac();if(NOISE)return NOISE;const b=a.createBuffer(1,a.sampleRate*1,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b;return b;}
function env(a,t,peak,dec,dest){const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+dec);g.connect(dest);return g;}
function noise(a,t,dur){const s=a.createBufferSource();s.buffer=noiseBuf();s.start(t);s.stop(t+dur+.05);return s;}
const DRUMS=[
 ['Kick',(a,t,o)=>{const os=a.createOscillator();os.frequency.setValueAtTime(150,t);os.frequency.exponentialRampToValueAtTime(42,t+.13);os.connect(env(a,t,1,.45,o));os.start(t);os.stop(t+.5);}],
 ['Snare',(a,t,o)=>{const n=noise(a,t,.2),f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;n.connect(f);f.connect(env(a,t,.55,.2,o));const os=a.createOscillator();os.type='triangle';os.frequency.setValueAtTime(220,t);os.frequency.exponentialRampToValueAtTime(140,t+.08);os.connect(env(a,t,.4,.12,o));os.start(t);os.stop(t+.2);}],
 ['Clap',(a,t,o)=>{const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.8;const g=a.createGain();g.gain.setValueAtTime(0,t);[0,.011,.022].forEach(d=>{g.gain.setValueAtTime(.7,t+d);g.gain.exponentialRampToValueAtTime(.05,t+d+.01);});g.gain.setValueAtTime(.6,t+.033);g.gain.exponentialRampToValueAtTime(.001,t+.22);const n=noise(a,t,.25);n.connect(f);f.connect(g);g.connect(o);}],
 ['Closed hat',(a,t,o)=>{const n=noise(a,t,.06),f=a.createBiquadFilter();f.type='highpass';f.frequency.value=7500;n.connect(f);f.connect(env(a,t,.32,.05,o));}],
 ['Open hat',(a,t,o)=>{const n=noise(a,t,.35),f=a.createBiquadFilter();f.type='highpass';f.frequency.value=7000;n.connect(f);f.connect(env(a,t,.28,.32,o));}],
 ['Low tom',(a,t,o)=>{const os=a.createOscillator();os.frequency.setValueAtTime(130,t);os.frequency.exponentialRampToValueAtTime(80,t+.25);os.connect(env(a,t,.7,.35,o));os.start(t);os.stop(t+.4);}],
 ['Rim',(a,t,o)=>{const os=a.createOscillator();os.type='square';os.frequency.value=820;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1700;os.connect(f);f.connect(env(a,t,.35,.035,o));os.start(t);os.stop(t+.06);}],
 ['Cowbell',(a,t,o)=>{const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=800;f.Q.value=2;const g=env(a,t,.3,.3,o);f.connect(g);[540,800].forEach(fr=>{const os=a.createOscillator();os.type='square';os.frequency.value=fr;os.connect(f);os.start(t);os.stop(t+.32);});}],
];
const BEATS={'Boom bap':[90,[[0,7,10],[4,12],[],[0,2,4,6,8,10,12,14],[],[],[],[]]],'Four on the floor':[124,[[0,4,8,12],[],[4,12],[0,4,8,12],[2,6,10,14],[],[],[]]],'Funk':[104,[[0,3,8,10],[4,12,15],[],[0,2,4,6,8,10,12,14],[14],[],[7],[]]],'Bossa':[130,[[0,3,4,7,8,11,12,15],[],[],[0,2,4,6,8,10,12,14],[],[],[0,3,6,10,13],[]]],'Reggaeton':[95,[[0,4,8,12],[3,6,11,14],[],[0,2,4,6,8,10,12,14],[],[],[],[]]],'Disco cowbell':[118,[[0,4,8,12],[4,12],[],[],[2,6,10,14],[],[],[0,3,6,8,11,14]]],'Empty':[100,[[],[],[],[],[],[],[],[]]]};
view('beat-maker','Rhythm','Lil Beat Maker','A 16-step drum machine with eight synthesized sounds. Tap cells to build a groove, pick a preset, add swing.',el=>{
 let grid=DRUMS.map(()=>Array(16).fill(false)),mute=DRUMS.map(()=>false),bpm=90,swing=0,playing=false,step=0,next=0,timer=null,raf=null,queue=[],ph=-1;
 const load=name=>{const [b,p]=BEATS[name];bpm=b;grid=DRUMS.map((_,r)=>Array.from({length:16},(_,i)=>p[r].includes(i)));};
 load('Boom bap');try{const s=JSON.parse(localStorage.getItem('tb-beat')||'null');if(s&&Array.isArray(s.grid)&&s.grid.length===8){grid=s.grid;bpm=s.bpm||bpm;swing=s.swing||0;}}catch(e){}
 const save=()=>{try{localStorage.setItem('tb-beat',JSON.stringify({grid,bpm,swing}));}catch(e){}};
 el.insertAdjacentHTML('beforeend',`<div class="panel"><div class="controls"><button class="btn primary" id="bPlay" style="min-width:96px">Play</button>
 <label class="fld" for="bBpm"><span>Tempo <b class="mono" id="bBpmV"></b> BPM</span><input id="bBpm" type="range" min="60" max="180" value="${bpm}" style="min-width:160px;padding:0"></label>
 <label class="fld" for="bSw"><span>Swing <b class="mono" id="bSwV"></b></span><input id="bSw" type="range" min="0" max="50" value="${Math.round(swing*100)}" style="min-width:130px;padding:0"></label>
 ${fld('Preset','bPre',[['','Load a preset…']].concat(Object.keys(BEATS).map(k=>[k,k])),'')}<button class="btn" id="bClr">Clear</button></div></div>
 <div class="panel"><div class="scroll"><div class="seq" id="bSeq"></div></div><p class="hint">Tap a sound's name to hear it, and tap its dot to mute the row. Your pattern is saved in this browser.</p></div>`);
 const seq=$('#bSeq',el);
 function render(){let h='<div></div>'+Array.from({length:16},(_,i)=>`<div class="num">${i%4===0?i/4+1:'·'}</div>`).join('');
  DRUMS.forEach((d,r)=>{h+=`<div class="lab ${mute[r]?'muted-row':''}" data-r="${r}"><span class="tag" data-m="${r}" title="Mute">${mute[r]?'off':'on'}</span>${d[0]}</div>`;for(let i=0;i<16;i++)h+=`<button class="step ${Math.floor(i/4)%2?'q':''} ${grid[r][i]?'on':''} ${i===ph?'ph':''}" data-r="${r}" data-i="${i}" aria-label="${d[0]} step ${i+1}" aria-pressed="${grid[r][i]}"></button>`;});
  seq.innerHTML=h;$('#bBpmV',el).textContent=bpm;$('#bSwV',el).textContent=Math.round(swing*100)+'%';$('#bBpm',el).value=bpm;}
 render();
 seq.onclick=e=>{const m=e.target.closest('[data-m]');if(m){const r=+m.dataset.m;mute[r]=!mute[r];render();return;}const s=e.target.closest('.step');if(s){const r=+s.dataset.r,i=+s.dataset.i;grid[r][i]=!grid[r][i];s.classList.toggle('on',grid[r][i]);s.setAttribute('aria-pressed',grid[r][i]);if(grid[r][i]&&!playing){const a=ac();DRUMS[r][1](a,a.currentTime+.01,MASTER);}save();return;}
  const l=e.target.closest('.lab');if(l){const a=ac();DRUMS[+l.dataset.r][1](a,a.currentTime+.01,MASTER);}};
 function sched(){const a=ac();while(next<a.currentTime+.12){const t=next;DRUMS.forEach((d,r)=>{if(grid[r][step]&&!mute[r])d[1](a,t,MASTER);});queue.push({s:step,t});const six=60/bpm/4;next+=six*(step%2===0?1+swing:1-swing);step=(step+1)%16;}}
 function vis(){const a=AC;while(queue.length&&queue[0].t<=a.currentTime){ph=queue.shift().s;$$('.step.ph',seq).forEach(x=>x.classList.remove('ph'));$$(`.step[data-i="${ph}"]`,seq).forEach(x=>x.classList.add('ph'));}raf=requestAnimationFrame(vis);}
 function start(){const a=ac();playing=true;step=0;next=a.currentTime+.06;queue=[];timer=setInterval(sched,25);sched();vis();$('#bPlay',el).textContent='Stop';}
 function stop(){playing=false;clearInterval(timer);cancelAnimationFrame(raf);ph=-1;$$('.step.ph',seq).forEach(x=>x.classList.remove('ph'));$('#bPlay',el).textContent='Play';}
 $('#bPlay',el).onclick=()=>playing?stop():start();
 const kd=e=>{if(e.code==='Space'&&!e.target.closest('input,select,textarea,button')){e.preventDefault();playing?stop():start();}};window.addEventListener('keydown',kd);
 $('#bBpm',el).oninput=e=>{bpm=+e.target.value;$('#bBpmV',el).textContent=bpm;save();};
 $('#bSw',el).oninput=e=>{swing=+e.target.value/100;$('#bSwV',el).textContent=e.target.value+'%';save();};
 $('#bPre',el).onchange=e=>{if(!e.target.value)return;load(e.target.value);e.target.value='';render();save();};
 $('#bClr',el).onclick=()=>{grid=DRUMS.map(()=>Array(16).fill(false));render();save();};
 return ()=>{stop();window.removeEventListener('keydown',kd);};
});

/* ================= Shell / routing ================= */
const ORDER=['Reference','Tuners','Piano','Strings','Formulas','Harmony','Rhythm'];
const side=$('#side');
side.innerHTML=`<div class="brand"><b>Tonebench</b><span>${VIEWS.length} tools</span></div>`+ORDER.map(g=>`<div class="nav-g"><h4>${g}</h4>${VIEWS.filter(v=>v.group===g).map(v=>`<a href="#${v.id}" data-id="${v.id}">${v.title}</a>`).join('')}</div>`).join('');
let cleanup=null;
function closeMenu(){side.classList.remove('open');$('#scrim').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');}
function route(){const id=(location.hash||'').slice(1);const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
 if(cleanup){try{cleanup()}catch(e){}cleanup=null;}clearTimers();Pitch.stop();stopDrone();
 const main=$('#main');main.innerHTML=`<div class="view">${head(v)}</div>`;const el=$('.view',main);
 try{cleanup=v.render(el)||null;}catch(e){el.insertAdjacentHTML('beforeend',`<div class="panel status warn">This tool hit an error: ${e.message}</div>`);console.error(e);}
 $$('a',side).forEach(a=>a.classList.toggle('on',a.dataset.id===v.id));document.title='Tonebench · '+v.title;closeMenu();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
$('#menuBtn').onclick=()=>{const o=!side.classList.contains('open');side.classList.toggle('open',o);$('#scrim').classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',o);};
$('#scrim').onclick=closeMenu;
route();
</script>
